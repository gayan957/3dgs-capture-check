# Settings for making broken copies of good captures (free, exact labels).
strengths: [light, medium, heavy]

ops:
  blur:
    light:  { ratio: 0.15, sigma: 3 }
    medium: { ratio: 0.35, sigma: 7 }
    heavy:  { ratio: 0.60, sigma: 13 }
  drop_sector:
    light:  { sector_deg: 45 }
    medium: { sector_deg: 90 }
    heavy:  { sector_deg: 150 }
  rotation_only:
    light:  { keep_ratio: 0.6 }
    medium: { keep_ratio: 0.4 }
    heavy:  { keep_ratio: 0.25 }
  subsample:
    light:  { keep_ratio: 0.5 }
    medium: { keep_ratio: 0.25 }
    heavy:  { keep_ratio: 0.1 }
  exposure_jitter:
    light:  { strength: 0.15 }
    medium: { strength: 0.35 }
    heavy:  { strength: 0.6 }
  noise:
    # JPEG quality is kept moderate on purpose: compressing hard enough removes
    # the very noise this op adds, and the measured noise then saturates, so
    # "heavy" came out no noisier than "medium". These values keep the three
    # strengths genuinely ordered.
    light:  { sigma: 6,  jpeg_quality: 80 }
    medium: { sigma: 14, jpeg_quality: 65 }
    heavy:  { sigma: 25, jpeg_quality: 50 }
  drop_gap:                      # image bundles only
    light:  { n: 2 }
    medium: { n: 5 }
    heavy:  { n: 10 }

output:
  jpeg_quality: 92               # quality used when writing the degraded bundle
  seed: 0
