# Settings for making broken copies of good captures (free, exact labels).
strengths: [light, medium, heavy]

ops:
  blur:
    light:  { ratio: 0.15, sigma: 3 }
    medium: { ratio: 0.35, sigma: 7 }
    heavy:  { ratio: 0.60, sigma: 13 }
  drop_sector:
    light:  { sector_deg: 45 }
    medium: { sector_deg: 90 }
    heavy:  { sector_deg: 150 }
  rotation_only:
    # Only produces a copy from a capture that really does contain a
    # rotation-only stretch; on a capture that walks throughout it creates
    # nothing rather than writing a false label. The three strengths all land at
    # walked_ratio 0 once the defect exists, so they are not separable by that
    # measurement -- they differ in how many frames are kept.
    light:  { keep_ratio: 0.6 }
    medium: { keep_ratio: 0.4 }
    heavy:  { keep_ratio: 0.25 }
  subsample:
    light:  { keep_ratio: 0.5 }
    medium: { keep_ratio: 0.25 }
    heavy:  { keep_ratio: 0.1 }
  exposure_jitter:
    light:  { strength: 0.15 }
    medium: { strength: 0.35 }
    heavy:  { strength: 0.6 }
  noise:
    # JPEG quality is kept moderate on purpose: compressing hard enough removes
    # the very noise this op adds, and the measured noise then saturates, so
    # "heavy" came out no noisier than "medium". These values keep the three
    # strengths genuinely ordered.
    light:  { sigma: 6,  jpeg_quality: 80 }
    medium: { sigma: 14, jpeg_quality: 65 }
    heavy:  { sigma: 25, jpeg_quality: 50 }
  drop_gap:                      # image bundles only
    # `share` is the share of neighbouring pairs the copy should leave below the
    # overlap threshold, and the op makes as many separate gaps as that takes.
    # All three sit above labeling.yaml's low_overlap_ratio of 0.2, so the label
    # is true of the copy; one gap on its own would score about 0.007 and would
    # not be. `photos_per_gap` is 2 because a single missing photo leaves the
    # junction at roughly 0.31 against a 0.3 threshold, too close to rely on.
    light:  { share: 0.25, photos_per_gap: 2 }
    medium: { share: 0.40, photos_per_gap: 2 }
    heavy:  { share: 0.60, photos_per_gap: 2 }

output:
  jpeg_quality: 92               # quality used when writing the degraded bundle
  seed: 0
